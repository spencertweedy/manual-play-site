<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">

  <!-- Netlify serves this page for any address that doesn't exist, at any depth, so every path here starts at the root -->
  <title>Page not found • Manual Play</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/icon.png">

  <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/main.css">

  <script src="/js/main.js" defer></script>

  <meta name="theme-color" content="#fff3dc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171c25" media="(prefers-color-scheme: dark)">
</head>

<body class="flex min-h-dvh flex-col bg-cream text-ink">
  <nav class="border-b border-line" aria-label="Main">
    <div class="mx-auto flex h-14 max-w-5xl items-center justify-between gap-4 px-6">
      <a href="/" class="flex items-center gap-2.5">
        <img src="/images/app-icon.png" width="28" height="28" alt="" class="size-7 rounded-[7px]">
        <span class="font-display text-xl font-bold uppercase [font-stretch:75%]">Manual Play</span>
      </a>
      <a href="https://testflight.apple.com/join/f4y22UjJ" class="rounded-full bg-black/80 px-4 py-2.5 text-sm font-medium text-white transition [text-box:trim-both_cap_alphabetic] hover:bg-neutral-800 dark:bg-ink dark:text-paper dark:hover:bg-ink/85">Download Beta</a>
    </div>
  </nav>

  <main class="flex flex-1 flex-col items-center justify-center gap-8 px-6 py-20 text-center">
    <!-- Same spinning disc as the home page header -->
    <button
      type="button"
      id="spin-disc"
      aria-label="Spin the record"
      class="size-[140px] cursor-pointer overflow-hidden rounded-[31px] bg-[#f5c518] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink"
    >
      <img
        src="/images/app-icon.png"
        srcset="/images/app-icon.png 1x, /images/app-icon@2x.png 2x"
        width="140"
        height="140"
        alt=""
        class="size-full [clip-path:circle(40%)]"
      >
    </button>

    <div class="max-w-md space-y-3">
      <p class="font-display text-sm font-bold tracking-widest text-muted uppercase [font-stretch:75%]">Error 404</p>
      <h1 class="font-display text-4xl font-bold uppercase [font-stretch:75%]">Skipped a groove</h1>
      <p class="text-lg text-pretty text-ink/75">There’s nothing at this address. It may have moved, or it was never pressed in the first place.</p>
    </div>

    <a href="/" class="font-medium underline decoration-amber-400 decoration-2 underline-offset-4 hover:decoration-ink">Back to the home page</a>
  </main>
</body>
</html>
